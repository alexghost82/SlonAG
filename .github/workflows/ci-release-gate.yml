# CI Release Gate — Wave 14 / Task 24
#
# Required checks (block merge):
#   • pytest            — collect + run (pytest.ini_options config)
#   • ruff check        — lint (tests/**.py, per pyproject.toml)
#   • ruff format       — style check
#   • mypy              — static type check (per pyproject.toml config)
#
# Optional / gated:
#   • hardware-tests    — GPU / RTSP; run only when dedicated secrets are set
#
# Rules:
#   – No continue-on-error, no || true, no fake-green.
#   – Hardware tests are environment-gated.
#   – CPU CI does not pretend it tested GPU or RTSP.
#   – Secrets flow only through GitHub secret references.

name: CI Release Gate

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main, "integration/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
#  Required quality gate
# ============================================================
jobs:
  ci:
    name: CI (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-${{ matrix.python }}-

      - name: Install system deps (Linux — portaudio for pyaudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libportaudioc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: pytest — collect
        run: python -m pytest tests --collect-only -q

      - name: pytest — run
        run: python -m pytest tests

      - name: ruff — check
        run: python -m ruff check .

      - name: ruff — format check
        run: python -m ruff format --check .

  # ============================================================
  #  mypy — static type checking
  # ============================================================
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.12-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-3.12-

      - name: Install system deps (Linux — portaudio for pyaudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libportaudioc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: mypy — check types
        run: python -m mypy

  # ============================================================
  #  Optional hardware tests (GPU / RTSP)
  #  Explicitly gated — CPU CI never masquerades as hardware-tested.
  # ============================================================
  hardware-tests:
    name: hardware (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      secrets.HW_GPU_AVAILABLE == 'true' &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    strategy:
      matrix:
        target: [gpu, rtsp]
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.12-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-3.12-

      - name: Install system deps (Linux — portaudio for pyaudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libportaudioc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ${{ matrix.target }} tests
        env:
          HW_TARGET: ${{ matrix.target }}
        run: |
          echo "Running hardware tests for: ${{ matrix.target }}"
          python -m pytest tests -m "${{ matrix.target }}" -v

      - name: Log that CPU CI did not test hardware
        run: |
          echo "::notice::Hardware tests skipped — this runner is CPU-only."
          echo "GPU and RTSP suites are not covered by this CI check."
