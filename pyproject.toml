[project]
name = "slon"
version = "0.1.0"
description = "Test harness and developer tooling for Slon"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "SlonAG Contributors" }]
keywords = ["ai", "agent", "automation", "testing", "tooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Runtime dependencies are owned by W01-T02. This file configures tooling only.

[project.scripts]
slon = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["tests/**/*.py", "acta/**/*.py", "providers/**/*.py", "speech/**/*.py",
           "server/**/*.py", "gateway/**/*.py", "policies/**/*.py",
           "localization/**/*.py", "config/**/*.py", "sessions/**/*.py",
           "runtime/jobs.py", "runtime/metrics.py", "runtime/commands.py"]
exclude = ["actions/**", "agent/**", "or_client.py", "memory/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
# CI mypy job is Python 3.12 only. Pytest still runs 3.11+3.12.
# User decision 2026-09-10: fix the pre-existing debt on 3.12 rather than
# keep python_version=3.11 (numpy stubs use 3.12 `type` syntax).
python_version = "3.12"
files = ["tests", "acta", "providers", "speech", "server", "gateway",
         "policies", "localization", "config", "sessions"]
explicit_package_bases = true
mypy_path = "."
pretty = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pyautogui",
    "PIL",
    "PIL.*",
    "cv2",
    "sounddevice",
    "google",
    "google.*",
    "psutil",
    "requests",
    "urllib3",
    "winreg",
    "qrcode",
    "qrcode.*",
    "zeroconf",
    "zeroconf.*",
    "whisper",
    "mss",
    "aiohttp",
    "openai",
    "send2trash",
    "yaml",
    "faster_whisper",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["actions.*", "agent.*", "memory.*"]
ignore_errors = true

# Outside tool.mypy.files; imported by tests. Do not type-check via follow.
[[tool.mypy.overrides]]
module = [
    "computer_control",
    "computer_control.*",
    "runtime",
    "runtime.*",
    "observability",
    "observability.*",
    "proactive_engine",
    "proactive_engine.*",
]
follow_imports = "skip"

[tool.coverage.run]
source = ["."]
omit = [
    "actions/**",
    "agent/**",
    "or_client.py",
    "setup.py",
    "tests/**",
    "ui/**",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
