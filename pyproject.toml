[project]
name = "slon"
version = "0.1.0"
description = "Test harness and developer tooling for Slon"
requires-python = ">=3.11,<3.13"
# Runtime dependencies are owned by W01-T02. This file configures tooling only.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
# Scope: tests/ only. Legacy application modules (main.py, ui.py, or_client.py,
# setup.py, actions/, agent/, memory/, core/, config/) are excluded so Wave 1
# CI does not require rewriting them.
include = ["tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.11"
files = ["tests", "mark", "providers", "speech", "server", "policies", "localization", "config"]
explicit_package_bases = true
mypy_path = "."
pretty = true
show_error_codes = true
warn_unused_ignores = true
# Follow imports for application code used by tests; do not ignore_errors globally.

[[tool.mypy.overrides]]
module = [
    "pyautogui",
    "PIL",
    "PIL.*",
    "cv2",
    "sounddevice",
    "google",
    "google.*",
    "psutil",
    "requests",
    "urllib3",
    "winreg",
    "qrcode",
    "qrcode.*",
    "zeroconf",
    "zeroconf.*",
    "whisper",
    "mss",
]
ignore_missing_imports = true

# Legacy desktop actions/agent trees remain deferred mypy debt (pre-Wave 13).
# Do not ignore_errors on mark/providers/speech/server/policies/config.
[[tool.mypy.overrides]]
module = ["actions.*", "agent.*", "or_client", "memory.*"]
ignore_errors = true
